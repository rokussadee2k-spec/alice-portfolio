[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single page, but this keeps any future deep link from 404-ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Let PDFs open in the browser instead of downloading, except the flipbook.
[[headers]]
  for = "/works/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/works/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
